name: Notification Service CI

on:
  push:
    branches: [main]
    paths:
      - 'services/notification-service/**'
  pull_request:
    paths:
      - 'services/notification-service/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/microservices-pro/notification-service

jobs:
  test:
    name: "Build + Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # ⚖ ENGINEERING DECISION — fail-fast vs allow-failure:
      # Tests here use fail-fast (the default).
      # If unit tests fail, the image is never built or pushed.
      # This is the correct behaviour for a service that has no
      # external dependencies (no DB, no Kafka needed for unit tests).
      # See Session 13 docx, 3.5 "fail-fast vs allow-failure" Design Choice.
      - name: Run tests
        working-directory: services/notification-service
        run: mvn -B test

      - name: Guard — @RetryableTopic present on handlePaymentEvent
        run: |
          if ! grep -q "@RetryableTopic" \
            services/notification-service/src/main/java/com/microservices/pro/notificationservice/NotificationService.java; then
            echo "::error::@RetryableTopic not found on handlePaymentEvent."
            echo "::error::Without it, a notification failure blocks the consumer thread and retries synchronously — not production-safe."
            exit 1
          fi
          echo "OK: @RetryableTopic present"

      - name: Guard — @DltHandler present (dead letter handling)
        run: |
          if ! grep -q "@DltHandler" \
            services/notification-service/src/main/java/com/microservices/pro/notificationservice/NotificationService.java; then
            echo "::error::@DltHandler not found."
            echo "::error::Without a DLT handler, messages that exhaust all retries are silently dropped."
            exit 1
          fi
          echo "OK: @DltHandler present"

  build-and-push:
    name: "Build Docker Image + Push to ghcr.io"
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: services/notification-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
