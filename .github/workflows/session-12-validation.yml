name: Session 12 Validation

on:
  push:
    branches: [main]
    paths:
      - 'services/order-service/**'
      - 'services/inventory-service/**'
      - 'services/payment-service/**'
  pull_request:
    paths:
      - 'services/order-service/**'
      - 'services/inventory-service/**'
      - 'services/payment-service/**'

jobs:
  verify-consumer-group-uniqueness:
    name: "Saga-wide: no duplicate @KafkaListener groupId (S7 + S12 combined)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract all groupId values and check for duplicates
        run: |
          GROUPS=$(grep -rhoE 'groupId\s*=\s*"[^"]+"' \
            services/order-service/src/main/java \
            services/inventory-service/src/main/java \
            services/payment-service/src/main/java \
            2>/dev/null | grep -oP '"[^"]+"' | tr -d '"' | sort)
          TOTAL=$(echo "$GROUPS" | grep -c . || true)
          UNIQUE=$(echo "$GROUPS" | sort -u | grep -c . || true)
          echo "All groupIds found:"
          echo "$GROUPS"
          echo "Total: $TOTAL | Unique: $UNIQUE"
          if [ "$TOTAL" != "$UNIQUE" ]; then
            echo "::error::Duplicate Kafka consumer group IDs detected."
            echo "::error::A duplicated groupId causes silent message loss — not an exception."
            echo "::error::Run: grep -rh groupId services/*/src/main/java/ | sort | uniq -d"
            exit 1
          fi
          echo "OK: all $UNIQUE group IDs are distinct"

  test-orchestrator:
    name: "order-service: OrderSagaOrchestratorTest (S12) + regression S4/S5/S7"
    runs-on: ubuntu-latest
    needs: verify-consumer-group-uniqueness
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Verify SagaKafkaConfig exists (required for sagaResultsListenerFactory)
        run: |
          if ! find services/order-service/src/main/java -name "SagaKafkaConfig.java" | grep -q .; then
            echo "::error::SagaKafkaConfig.java not found."
            echo "::error::OrderSagaOrchestrator uses containerFactory='sagaResultsListenerFactory'"
            echo "::error::which requires this @Configuration bean. Without it, context fails to start."
            exit 1
          fi
          echo "OK: SagaKafkaConfig.java found"
      - name: Run order-service unit tests (S12 + regression S4/S5/S7)
        working-directory: services/order-service
        run: mvn -B test

  compile-handlers:
    name: "inventory-service + payment-service: Saga command handlers compile"
    runs-on: ubuntu-latest
    needs: verify-consumer-group-uniqueness
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile inventory-service (includes InventorySagaCommandHandler)
        working-directory: services/inventory-service
        run: mvn -B compile
      - name: Compile payment-service (includes PaymentSagaCommandHandler)
        working-directory: services/payment-service
        run: mvn -B compile
