name: Session 9 Validation

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/*/Dockerfile'
      - 'services/*/Dockerfile'
      - 'docker-compose.yml'
  pull_request:
    paths:
      - 'infrastructure/*/Dockerfile'
      - 'services/*/Dockerfile'
      - 'docker-compose.yml'

jobs:
  verify-dockerfiles-exist:
    name: "All 7 Dockerfiles present (S9 Definition of Done)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify all required Dockerfiles exist
        run: |
          MISSING=0
          for f in \
            infrastructure/eureka-server/Dockerfile \
            infrastructure/config-server/Dockerfile \
            infrastructure/api-gateway/Dockerfile \
            services/product-service/Dockerfile \
            services/order-service/Dockerfile \
            services/payment-service/Dockerfile \
            services/inventory-service/Dockerfile; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing Dockerfile: $f"
              MISSING=1
            else
              echo "OK: $f"
            fi
          done
          [ $MISSING -eq 0 ] || exit 1

      - name: Verify no Dockerfile targets Kubernetes/Helm/ArgoCD (OBG-001 guard)
        run: |
          if grep -ri "kubectl\|helm\|argocd\|kustomize" \
            infrastructure/*/Dockerfile services/*/Dockerfile 2>/dev/null; then
            echo "::error::A Dockerfile references Kubernetes/Helm/ArgoCD tooling — OBG-001 violation. That content belongs in Sessions 13-16."
            exit 1
          fi
          echo "OBG-001 clean"

  build-images:
    name: "docker build succeeds for all 7 services"
    runs-on: ubuntu-latest
    needs: verify-dockerfiles-exist
    strategy:
      matrix:
        include:
          - context: infrastructure/eureka-server
            image: microservices-pro/eureka-server
          - context: infrastructure/config-server
            image: microservices-pro/config-server
          - context: infrastructure/api-gateway
            image: microservices-pro/api-gateway
          - context: services/product-service
            image: microservices-pro/product-service
          - context: services/order-service
            image: microservices-pro/order-service
          - context: services/payment-service
            image: microservices-pro/payment-service
          - context: services/inventory-service
            image: microservices-pro/inventory-service
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.image }}:local
        run: |
          docker build \
            --tag ${{ matrix.image }}:local \
            ${{ matrix.context }}

      - name: Verify image size is under 500 MB (multi-stage guard)
        run: |
          SIZE_MB=$(docker image inspect ${{ matrix.image }}:local \
            --format='{{.Size}}' | awk '{printf "%.0f", $1/1024/1024}')
          echo "Image size: ${SIZE_MB} MB"
          if [ "$SIZE_MB" -gt 500 ]; then
            echo "::error::${{ matrix.image }}:local is ${SIZE_MB} MB — exceeds 500 MB threshold."
            echo "::error::This usually means the Dockerfile is still single-stage (JDK + Maven included)."
            echo "::error::Complete TODO 1 (multi-stage build) to bring it under ~250 MB."
            exit 1
          fi
          echo "OK: ${SIZE_MB} MB (under 500 MB threshold)"

      - name: Verify image runs as non-root user
        run: |
          USER_ID=$(docker run --rm --entrypoint id ${{ matrix.image }}:local -u)
          echo "Container uid: $USER_ID"
          if [ "$USER_ID" = "0" ]; then
            echo "::error::${{ matrix.image }}:local runs as root (uid 0)."
            echo "::error::Complete TODO 2 (add non-root user uid 1001) in the Dockerfile."
            exit 1
          fi
          echo "OK: non-root uid $USER_ID"

  validate-docker-compose:
    name: "docker compose config validates cleanly"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file syntax
        run: docker compose config --quiet
