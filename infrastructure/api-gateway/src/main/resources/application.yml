# application.yml — API Gateway
# Session 2  — routing, load balancing
# Session 3  — rate limiting, jwt.secret (DELETED in Session 20)
# Session 20 — oauth2.resourceserver.jwt.issuer-uri (replaces jwt.secret)

server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:http://localhost:8888"
  cloud:
    gateway:
      routes:
        - id: product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/v1/products/**
        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/orders/**
        - id: inventory-service
          uri: lb://INVENTORY-SERVICE
          predicates:
            - Path=/api/v1/inventory/**
        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/v1/payments/**
  data:
    redis:
      host: localhost
      port: 6379

  # Session 20 — Spring Security OAuth2 Resource Server.
  # Spring fetches the JWKS from Keycloak automatically at startup.
  # No shared secret. No hand-rolled signature validation.
  # issuer-uri must match the 'iss' claim in every incoming JWT exactly.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/ecommerce-platform

  # jwt.secret and PUBLIC_ROUTES config from Session 3 are DELETED.
  # Do not re-add them — they are replaced, not supplemented.

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
