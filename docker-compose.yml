# docker-compose.yml — Session 19 addition: Keycloak
#
# Add this block to the existing docker-compose.yml.
# Port 8180 (not 8080) to avoid conflict with the API Gateway.
#
# Dev mode (start-dev): no SSL required, embeds H2 database.
# Production: use KC_DB + KC_DB_URL + proper TLS.
#
# Admin credentials: admin / admin (DEV ONLY — change in production).
#
# After startup, import the realm:
#   - Open http://localhost:8180
#   - Login: admin / admin
#   - Create Realm → Import → select keycloak/realm-export.json
#   OR use the auto-import via KC_IMPORT (see below).

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: keycloak
    networks:
      - platform-net
    ports:
      - "8180:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    command: start-dev --import-realm
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      # Mounts realm-export.json for auto-import on first start.
      # Keycloak imports all JSON files in this directory at startup.
    healthcheck:
      test: ["CMD-SHELL",
             "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200'"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 5
