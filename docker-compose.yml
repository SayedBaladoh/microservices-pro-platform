# docker-compose.yml
# Session 9 — Lab 8A: Docker Containerization
#
# The infrastructure services (postgres, redis, kafka) are provided with
# working healthchecks — you should NOT need to modify them.
#
# Your TODOs are on the Spring Boot services below:
#   TODO A: Add a healthcheck to each Spring Boot service.
#           Pattern: curl -f http://localhost:<PORT>/actuator/health
#   TODO B: Add depends_on with the correct condition (service_healthy
#           for Spring Boot deps, service_started for kafka) so services
#           start in the right order.
#   TODO C: Build and verify: docker compose build && docker compose up -d
#           Then check: docker compose ps (all should reach "healthy")
#
# 🎯 DESIGN CHOICE — service_healthy vs service_started:
#   Use service_healthy for services that expose /actuator/health.
#   Use service_started for Kafka (no health endpoint to poll).

networks:
  platform-net:
    driver: bridge

volumes:
  postgres-data:

services:

  # ── Infrastructure (provided — do NOT modify healthchecks here) ─────────

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    networks:
      - platform-net
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: microservices_pro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - platform-net
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    networks:
      - platform-net
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    networks:
      - platform-net
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # ── Spring Cloud Infrastructure ────────────────────────────────────────

  config-server:
    build:
      context: ./infrastructure/config-server
      dockerfile: Dockerfile
    image: microservices-pro/config-server:local
    container_name: config-server
    networks:
      - platform-net
    ports:
      - "8888:8888"
    environment:
      SPRING_APPLICATION_NAME: config-server
    # TODO A: Add healthcheck
    # TODO B: No depends_on needed for config-server (it has no upstream Spring Boot deps)

  eureka-server:
    build:
      context: ./infrastructure/eureka-server
      dockerfile: Dockerfile
    image: microservices-pro/eureka-server:local
    container_name: eureka-server
    networks:
      - platform-net
    ports:
      - "8761:8761"
    environment:
      SPRING_APPLICATION_NAME: eureka-server
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
    # TODO A: Add healthcheck
    # TODO B: Add depends_on config-server (condition: service_healthy)

  api-gateway:
    build:
      context: ./infrastructure/api-gateway
      dockerfile: Dockerfile
    image: microservices-pro/api-gateway:local
    container_name: api-gateway
    networks:
      - platform-net
    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_NAME: api-gateway
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    # TODO A: Add healthcheck
    # TODO B: Add depends_on config-server + eureka-server + redis (all service_healthy)

  product-service:
    build:
      context: ./services/product-service
      dockerfile: Dockerfile
    image: microservices-pro/product-service:local
    container_name: product-service
    networks:
      - platform-net
    ports:
      - "8081:8081"
    environment:
      SPRING_APPLICATION_NAME: product-service
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/microservices_pro
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    # TODO A: Add healthcheck
    # TODO B: Add depends_on config-server + eureka-server + postgres + redis

  inventory-service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    image: microservices-pro/inventory-service:local
    container_name: inventory-service
    networks:
      - platform-net
    ports:
      - "8084:8084"
    environment:
      SPRING_APPLICATION_NAME: inventory-service
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    # TODO A: Add healthcheck
    # TODO B: Add depends_on config-server + eureka-server + kafka (kafka: service_started)

  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    image: microservices-pro/payment-service:local
    container_name: payment-service
    networks:
      - platform-net
    ports:
      - "8083:8083"
    environment:
      SPRING_APPLICATION_NAME: payment-service
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PAYMENT_FAILURE_RATE: "0.5"
      PAYMENT_DELAY_MS: "0"
    # TODO A: Add healthcheck
    # TODO B: Add depends_on config-server + eureka-server + kafka

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    image: microservices-pro/order-service:local
    container_name: order-service
    networks:
      - platform-net
    ports:
      - "8082:8082"
    environment:
      SPRING_APPLICATION_NAME: order-service
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/microservices_pro
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    # TODO A: Add healthcheck
    # TODO B: Add depends_on config-server + eureka-server + postgres + kafka
