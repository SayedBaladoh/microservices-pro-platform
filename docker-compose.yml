# docker-compose.yml — Session 17 additions
#
# Add these three service blocks to the existing docker-compose.yml
# (after the Spring Boot services section).
#
# Zipkin:     distributed trace collector  → port 9411
# Prometheus: metrics scraper + storage    → port 9090
# Grafana:    metrics dashboard            → port 3000
#
# Note: Zipkin is introduced HERE for the first time (Session 17).
# It was listed as "available later" in the Onboarding Guide (OBG-001).

  zipkin:
    image: openzipkin/zipkin:3
    container_name: zipkin
    networks:
      - platform-net
    ports:
      - "9411:9411"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9411/health"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    networks:
      - platform-net
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    networks:
      - platform-net
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
