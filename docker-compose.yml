# docker-compose.yml — Session 13 addition: notification-service
#
# Add this block to the existing docker-compose.yml (after payment-service).
# The rest of the file (postgres, redis, kafka, all other services) is unchanged.
#
# notification-service depends on:
#   - kafka: service_started (same pattern as order/inventory/payment)
#   - eureka-server: service_healthy
#   - config-server: service_healthy
#
# NOTE: This service listens on payment-events (the existing S7/S12 topic).
# No new Kafka topics are created — @RetryableTopic auto-creates:
#   payment-events-retry-0, payment-events-retry-1, payment-events-dlt

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    image: microservices-pro/notification-service:local
    container_name: notification-service
    networks:
      - platform-net
    ports:
      - "8085:8085"
    environment:
      SPRING_APPLICATION_NAME: notification-service
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 5
