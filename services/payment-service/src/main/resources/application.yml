# application.yml — Payment Service
# Session 4  — port, Eureka, Config Server, payment.failure-rate
# Session 5  — payment.delay-ms
# Session 7  — kafka (inventory-events for Choreography)
# Session 12 — adds: consumer group payment-saga-handler on saga-commands

server:
  port: 8083

spring:
  application:
    name: payment-service
  config:
    import: "optional:configserver:http://localhost:8888"
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      # Default group for S7 Choreography listener
      group-id: ${spring.application.name}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.microservices.pro.*"
      auto-offset-reset: earliest
      # Session 12 group IDs on this service:
      #   payment-saga-handler  (PaymentSagaCommandHandler, saga-commands)
      # Session 7 group IDs still active on this service (Choreography coexists):
      #   payment-service       (PaymentSagaHandler, inventory-events)

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

payment:
  failure-rate: 0.5
  delay-ms: 0
