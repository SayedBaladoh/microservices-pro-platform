# application.yml — Product Service
# Session 1  — port, Eureka, Config Server
# Session 8  — datasource, redis, cache
# Session 17 — adds: tracing, prometheus endpoint, logging

server:
  port: 8081

spring:
  application:
    name: product-service
  config:
    import: "optional:configserver:http://localhost:8888"
  datasource:
    url: jdbc:postgresql://localhost:5432/microservices_pro
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
    redis:
      time-to-live: 300000
      cache-null-values: false

  # Session 17 — Distributed Tracing
  # sampling.probability: 1.0 = trace EVERY request (DEV ONLY).
  # Production: 0.1 (10%) or use adaptive sampling to reduce Zipkin load.
  sleuth:
    sampler:
      probability: 1.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,caches,prometheus
        # prometheus endpoint — scraped by Prometheus every 15s
  metrics:
    tags:
      application: ${spring.application.name}
      # adds application="product-service" label to every Prometheus metric
      # → enables per-service dashboards in Grafana
  tracing:
    sampling:
      probability: 1.0
    zipkin:
      endpoint: http://localhost:9411/api/v2/spans

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Session 17 — Structured JSON logging
# logback-spring.xml switches the format to JSON.
# traceId and spanId are injected automatically by Micrometer Tracing
# into the MDC and appear in every log line as JSON fields.
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{traceId}/%X{spanId}] %-5level %logger{36} - %msg%n"
    # Used only when logback-spring.xml is NOT present (fallback).
    # When logback-spring.xml IS present (as in this repo), it overrides this.
