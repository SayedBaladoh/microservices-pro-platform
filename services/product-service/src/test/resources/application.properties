# src/test/resources/application.properties — product-service
# Applied to ALL tests in product-service, including @WebMvcTest and
# the TestContainers integration test.
#
# For @WebMvcTest: Spring context is minimal — most of these are ignored
# (no datasource is created). They only take effect in @SpringBootTest.
#
# For TestContainers (@SpringBootTest): @DynamicPropertySource overrides
# spring.datasource.* with the container's dynamic values, so the values
# below for datasource are just sensible fallbacks that are never actually
# used once @DynamicPropertySource fires.

# DDL — create schema from @Entity annotations, drop after tests.
spring.jpa.hibernate.ddl-auto=create-drop

# Suppress Hibernate SQL logging in test output (set to DEBUG to see queries).
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN

# Suppress Eureka registration attempts during tests.
eureka.client.enabled=false

# Disable Spring Cloud Config during tests (no Config Server running).
spring.cloud.config.enabled=false
spring.config.import=

# Suppress startup logs from TestContainers itself.
logging.level.org.testcontainers=WARN
logging.level.com.github.dockerjava=WARN
