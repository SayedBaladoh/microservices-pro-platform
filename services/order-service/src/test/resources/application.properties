# src/test/resources/application.properties — order-service
# Applied to integration tests that use @SpringBootTest.
# @TestPropertySource on specific test classes can override these.

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Suppress noisy startup logs during tests
eureka.client.enabled=false
spring.cloud.config.enabled=false
spring.config.import=
logging.level.org.testcontainers=WARN
logging.level.com.github.dockerjava=WARN
logging.level.com.microservices.pro=INFO

# Pact — write generated pact files to target/pacts/
# (default, but explicit for visibility)
pact.rootDir=target/pacts
